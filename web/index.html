<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>JSON &amp; 日志工作台</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="appbar">
    <div class="brand" title="BestAutomation 配置与日志工作台">
      <span class="logo" aria-hidden="true">▤</span>
      <span class="brand-text">JSON &amp; 日志工作台</span>
      <span class="brand-sub" id="brand-sub"></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="功能模块"></nav>
    <div class="appbar-right">
      <div class="font-ctl" role="group" aria-label="字号">
        <button class="icon-btn" id="font-minus" title="减小字号 (Ctrl+-)">A−</button>
        <button class="icon-btn" id="font-plus" title="增大字号 (Ctrl+=)">A+</button>
      </div>
      <div class="theme-switch" id="theme-switch" role="group" aria-label="主题">
        <button data-theme-value="light" title="明亮">☀</button>
        <button data-theme-value="paper" title="护眼米色">◑</button>
        <button data-theme-value="dark" title="暗色">☾</button>
      </div>
      <button class="icon-btn" id="help-btn" title="快捷键与帮助 (?)" aria-label="帮助">?</button>
    </div>
  </header>

  <main id="view-root" tabindex="-1"></main>

  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <template id="tpl-empty">
    <div class="empty">
      <div class="empty-icon">⌘</div>
      <p class="empty-title"></p>
      <p class="empty-desc"></p>
    </div>
  </template>

  <script>
    // 兜底：任何未捕获的脚本错误都直接显示出来，避免"页面空白但不知道为什么"
    window.__studioErrors = [];
    window.addEventListener('error', (event) => {
      const msg = `脚本错误：${event.message}（${String(event.filename || '').split('/').pop()}:${event.lineno}）`;
      window.__studioErrors.push(msg);
      document.documentElement.dataset.error = msg;
      const stack = document.getElementById('toast-stack');
      if (stack) {
        const box = document.createElement('div');
        box.className = 'toast err';
        box.innerHTML = '<div class="msg"></div><button class="close">✕</button>';
        box.querySelector('.msg').textContent = msg;
        box.querySelector('.close').onclick = () => box.remove();
        stack.appendChild(box);
      }
    });
    window.addEventListener('unhandledrejection', (event) => {
      const reason = event.reason || {};
      window.__studioErrors.push(`未处理的异常：${reason.message || reason}`);
      document.documentElement.dataset.error = String(reason.message || reason);
    });
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
